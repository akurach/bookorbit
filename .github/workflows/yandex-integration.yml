name: Yandex Integration (Fork)
run-name: Yandex integration - ${{ github.ref_name }}

on:
  push:
    branches:
      - "BO-1817-*"
      - "BO-1818-*"
      - "feat/yandex-books-*"
  workflow_dispatch:

concurrency:
  group: yandex-integration-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  setup:
    name: Select and validate suites
    if: github.repository == 'akurach/bookorbit'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26"
      - name: Test suite discovery and selection
        run: node --test scripts/e2e/select-yandex-matrix.test.mjs
      - name: Select affected integrations
        id: matrix
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_BASE_SHA: ${{ github.event.before }}
          GITHUB_HEAD_SHA: ${{ github.sha }}
        run: echo "matrix=$(node scripts/e2e/select-yandex-matrix.mjs)" >> "$GITHUB_OUTPUT"

  quality:
    name: Fork quality - ${{ matrix.name }}
    needs: setup
    if: needs.setup.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Lint, types and policies
            command: pnpm verify:fast && pnpm test:charts && pnpm test:pr-policy
          - name: Server unit tests
            command: pnpm test:server
          - name: Client unit tests
            command: pnpm test:client
    env:
      NODE_ENV: test
      JWT_SECRET: yandex-ci-fixture-secret
      DATABASE_URL: postgres://bookorbit:bookorbit@localhost:5432/bookorbit_e2e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-node-pnpm
      - name: Run quality check
        run: ${{ matrix.command }}

  e2e:
    needs: setup
    if: needs.setup.outputs.matrix != '[]'
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(needs.setup.outputs.matrix) }}
    permissions:
      contents: read
      checks: write
    uses: ./.github/workflows/e2e-runner.yml
    with:
      suite-id: ${{ matrix.suite.id }}
      check-name: "Yandex E2E - ${{ matrix.suite.name }}"
      artifact-name: "yandex-${{ matrix.suite.id }}-report"
      job-timeout-minutes: ${{ matrix.suite.timeout }}

  build:
    name: Build home upgrade artifact
    needs: setup
    if: needs.setup.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VITE_SOURCE_CODE_URL: https://github.com/akurach/bookorbit/tree/${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-node-pnpm
      - name: Build server and web client
        run: pnpm build:server && pnpm --dir client build-only
      - name: Package application without dependencies or credentials
        run: node scripts/build-home-upgrade-artifact.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: home-library-3.6-application
          path: test-results/home-upgrade/*.tar.gz
          retention-days: 7

  gate:
    name: Yandex integration gate
    needs: [setup, quality, e2e, build]
    if: always() && github.repository == 'akurach/bookorbit'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require successful selected checks
        env:
          SETUP_RESULT: ${{ needs.setup.result }}
          MATRIX: ${{ needs.setup.outputs.matrix }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          test "$SETUP_RESULT" = success
          if [ "$MATRIX" != '[]' ]; then
            test "$QUALITY_RESULT" = success
            test "$E2E_RESULT" = success
            test "$BUILD_RESULT" = success
          fi
